                  priority: HIGH
        - uuid: 3ea78af894a04be88ac82af3f30b2398
          name: 'Discovery | Network interfaces Virtual'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IF},IF-MIB::ifDescr, {#IFALIAS},IF-MIB::ifAlias]'
          key: discovery.vlanif
          delay: 1d
          filter:
            conditions:
              - macro: '{#IF}'
                value: 'Eth-Trunk.*'
                formulaid: A
              - macro: '{#IF}'
                value: 'Virtual-Ethernet.*'
                formulaid: B
              - macro: '{#IF}'
                value: 'Vlanif.*'
                formulaid: C
          lifetime: 7d
          description: |
            You may also consider using IF-MIB::ifType or IF-MIB::ifAlias for discovery depending on your filtering needs.
            
            {$SNMP_COMMUNITY} is a global macro.
          item_prototypes:
            - uuid: 22f6b034c4694d468bf9b2c681439d29
              name: 'Incoming traffic on interface - {#IF}: ({#IFALIAS})'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCInOctets.{#SNMPINDEX}'
              key: 'ifHCInOctets.vlanif.[{#IF}.{#SNMPINDEX}]'
              trends: 365d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: d0c35ec554ac4706ab2074ba4db5d538
              name: 'Outgoing traffic on interface - {#IF}: ({#IFALIAS})'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCOutOctets.{#SNMPINDEX}'
              key: 'ifHCOutOctets.vlanif.[{#IF}.{#SNMPINDEX}]'
              trends: 365d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: 9738ff2e98d74224945f64b210dfabf9
              name: 'Status da interface - {#IF}: ({#IFALIAS})'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifOperStatus.{#SNMPINDEX}'
              key: 'ifOperStatus.vlanif.[{#IF}.{#SNMPINDEX}]'
              history: 1w
              trends: 365d
              trigger_prototypes:
                - uuid: 01176f5e1150445b8fd386949d9fcc76
                  expression: '(last(/Template Switch Huawei 6700 Series - Netstream/ifOperStatus.vlanif.[{#IF}.{#SNMPINDEX}],#1)<>last(/Template Switch Huawei 6700 Series - Netstream/ifOperStatus.vlanif.[{#IF}.{#SNMPINDEX}],#2))=1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Template Switch Huawei 6700 Series - Netstream/ifOperStatus.vlanif.[{#IF}.{#SNMPINDEX}])=1'
                  name: 'Status da interface - {#IF}: ({#IFALIAS})'
                  priority: HIGH
                - uuid: e95db2acd2d54254a48f70ff59950560
                  expression: 'change(/Template Switch Huawei 6700 Series - Netstream/ifOperStatus.vlanif.[{#IF}.{#SNMPINDEX}])=2'
                  name: 'Vlan down - {#IF}: ({#IFALIAS})'
                  priority: INFO
          graph_prototypes:
            - uuid: 9889a3d21de54461ae9712a3365a0e9d
              name: 'Traffic on interface virtual {#IF}: ({#IFALIAS})'
              graph_items:
                - color: 00FF00
