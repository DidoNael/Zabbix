              key: 'ifHCOutOctets[{#IF}.{#SNMPINDEX}]'
              history: 1w
              trends: 90d
              units: bps
              description: 'The number of octets transmitted in MAC frames on this interface, including the MAC header and FCS.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Interfaces
            - uuid: 40f65434a4ac4d2592da4a04d6dfb0af
              name: 'Inbound errors on interface - {#IF}: ({#IFALIAS})'
