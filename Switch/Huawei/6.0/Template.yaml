              name: 'ASN Owner: {#IP} - {#ASN}'
              type: EXTERNAL
              key: 'get_asn_owner_v2.sh[{#ASN}]'
              delay: 1h
              trends: 365d
              value_type: TEXT
              tags:
                - tag: Application
                  value: 'Peer V4'
          trigger_prototypes:
            - uuid: fe0b98bd1ecb43c09abca85cb045b4a6
              expression: 'find(/Template Switch Huawei 6700 Series - Netstream/BgpPeerRemoteAs[{#IP}.{#ASN}],,"regexp","{$BGP_PEER_AS}")=0 and last(/Template Switch Huawei 6700 Series - Netstream/BgpPeerState.[{#IP}.{#ASN}],#3)<>6 and last(/Template Switch Huawei 6700 Series - Netstream/BgpPeerAdminStatus[{#IP}.{#ASN}])=2 and length(last(/Template Switch Huawei 6700 Series - Netstream/get_asn_owner_v2.sh[{#ASN}]))>0'
