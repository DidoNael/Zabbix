        - uuid: 148390136ebc4b7e965a50e15c42e51b
          name: 'Discovery | Network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IF},IF-MIB::ifDescr, {#IFALIAS},IF-MIB::ifAlias]'
          key: ifDescr
          delay: 1d
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFALIAS}'
                value: NOT_USE
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#IF}'
                value: 'Eth-Trunk.*'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IF}'
                value: 'InLoopBack.*'
                operator: NOT_MATCHES_REGEX
                formulaid: C
              - macro: '{#IF}'
                value: 'Tunnel.*'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#IF}'
                value: 'Virtual-Access.*'
                operator: NOT_MATCHES_REGEX
                formulaid: E
              - macro: '{#IF}'
                value: 'Virtual-Ethernet.*'
                operator: NOT_MATCHES_REGEX
                formulaid: F
              - macro: '{#IF}'
                value: 'Vlanif.*'
                operator: NOT_MATCHES_REGEX
                formulaid: G
          lifetime: 7d
          description: |
            You may also consider using IF-MIB::ifType or IF-MIB::ifAlias for discovery depending on your filtering needs.
            
            {$SNMP_COMMUNITY} is a global macro.
          item_prototypes:
            - uuid: 037f83a783c34f988b0442804c79dc76
              name: 'Incoming traffic on interface - {#IF}: ({#IFALIAS})'
              type: SNMP_AGENT
              snmp_oid: 'IF-MIB::ifHCInOctets.{#SNMPINDEX}'
              key: 'ifHCInOctets[{#IF}.{#SNMPINDEX}]'
              history: 1w
              trends: 90d
              units: bps
              description: 'The number of octets in valid MAC frames received on this interface, including the MAC header and FCS.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Interfaces
            - uuid: ead83b81264e4146b7eda29218f62d54
              name: 'Outgoing traffic on interface - {#IF}: ({#IFALIAS})'
