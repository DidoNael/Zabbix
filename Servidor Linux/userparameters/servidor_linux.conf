######################### SERVIDOR LINUX - ZABBIX AGENT ACTIVE - NETSTREAM #########################
#
# Instalar em: /etc/zabbix/zabbix_agentd.d/servidor_linux.conf  (ou zabbix_agentd.conf)
# Reiniciar:   systemctl restart zabbix-agent
# Testar:      zabbix_agentd -t <chave>
#
# Dependências: sysstat (iostat), dnsutils/bind-utils (dig)
#   Debian/Ubuntu: apt install sysstat dnsutils
#   CentOS/RHEL:   yum install sysstat bind-utils
#
###################################################################################################

# ===========================================================
# HARDWARE - CPU
# ===========================================================
# Retorna % de uso de CPU (user + system)
# Chave Zabbix: cpu.utilization
UserParameter=cpu.utilization,top -b -n1 | grep "Cpu(s)" | awk '{print $2 + $4}'

# ===========================================================
# HARDWARE - DISCO RAIZ
# ===========================================================
# Retorna % de uso do disco / (raiz)
# Chave Zabbix: disk.used.percent.root
# Trigger: >=90 = "Consumo de disco elevado" (HIGH)
#          >=99 = "Disco Cheio" (HIGH)
UserParameter=disk.used.percent.root,df -h / | awk 'NR==2 {print $5}' | sed 's/%//'

# ===========================================================
# HARDWARE - DISCO I/O  (requer: sysstat / iostat)
# ===========================================================
# Tempo médio de espera por operação de leitura (ms)
# Chave Zabbix: disk.iostat.await
UserParameter=disk.iostat.await,iostat -d -x 1 2 | awk '/sda/ {print $10}' | tail -n 1 | sed 's/,/./'

# Tempo médio de espera por leitura (ms)
# Chave Zabbix: disk.iostat.r_await
UserParameter=disk.iostat.r_await,iostat -d -x 1 2 | awk '/sda/ {print $11}' | tail -n 1 | sed 's/,/./'

# Tempo médio de espera por escrita (ms)
# Chave Zabbix: disk.iostat.w_await
UserParameter=disk.iostat.w_await,iostat -d -x 1 2 | awk '/sda/ {print $12}' | tail -n 1 | sed 's/,/./'

# Taxa de leitura do disco (kB/s)
# Chave Zabbix: disk.iostat.read
UserParameter=disk.iostat.read,iostat -d -x 1 2 | awk '/sda/ {print $4}' | tail -n 1 | sed 's/[^0-9.]*//g'

# Taxa de escrita do disco (kB/s)
# Chave Zabbix: disk.iostat.write
UserParameter=disk.iostat.write,iostat -d -x 1 2 | awk '/sda/ {print $5}' | tail -n 1 | sed 's/[^0-9.]*//g'

# ===========================================================
# REDE
# ===========================================================
# Bytes recebidos por segundo na interface principal
# Chave Zabbix: net.if.input.mbps
UserParameter=net.if.input.mbps,cat /proc/net/dev | awk '/eth0|ens|enp/ {print $2; exit}'

# Bytes enviados por segundo na interface principal
# Chave Zabbix: net.if.output.mbps
UserParameter=net.if.output.mbps,cat /proc/net/dev | awk '/eth0|ens|enp/ {print $10; exit}'

# ===========================================================
# SEGURANÇA
# ===========================================================
# Contagem de tentativas de login SSH falhas (via journalctl ou last)
# Chave Zabbix: ssh.failed.logins
# Trigger: change() > 100 = "Tentativa de brute force" (AVERAGE)
UserParameter=ssh.failed.logins,grep -c "Failed password" /var/log/secure 2>/dev/null || grep -c "Failed password" /var/log/auth.log 2>/dev/null || echo 0

# ===========================================================
# UPTIME
# ===========================================================
# Uptime do sistema em segundos
# Chave Zabbix: uptime.system
# Trigger: < 86400s (24h) = "Host Reiniciado" (HIGH), recovery >= 3600s (1h)
UserParameter=uptime.system,awk '{print int($1)}' /proc/uptime

# ===========================================================
# DNS (requer: dnsutils / bind-utils)
# ===========================================================
# Verifica resolução DNS de sites de referência.
# Retorna 1 = OK, 0 = FALHA
# Trigger: todos = 0 simultaneamente = "Falha de resolução DNS" (HIGH)
#          Indica falha total de DNS no servidor — não dispara se só 1 falhar.
#
# Chave Zabbix: dns.check.globo
UserParameter=dns.check.globo,dig +short +time=3 +tries=1 globo.com 2>/dev/null | grep -cP "^\d" | awk '{print ($1>0)?1:0}'

# Chave Zabbix: dns.check.registrobr
UserParameter=dns.check.registrobr,dig +short +time=3 +tries=1 registro.br 2>/dev/null | grep -cP "^\d" | awk '{print ($1>0)?1:0}'

# Chave Zabbix: dns.check.uol
UserParameter=dns.check.uol,dig +short +time=3 +tries=1 uol.com.br 2>/dev/null | grep -cP "^\d" | awk '{print ($1>0)?1:0}'

# Chave Zabbix: dns.check.youtube
UserParameter=dns.check.youtube,dig +short +time=3 +tries=1 youtube.com 2>/dev/null | grep -cP "^\d" | awk '{print ($1>0)?1:0}'
