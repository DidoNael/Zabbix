##############################################################################
# SERVIDOR LINUX - ZABBIX AGENT ACTIVE - NETSTREAM
# Padrão único para CentOS/RHEL, Debian e Ubuntu
#
# Instalar:   cp servidor_linux.conf /etc/zabbix/zabbix_agentd.d/
# Restartar:  systemctl restart zabbix-agent
# Testar:     zabbix_agentd -t <chave>
#
# Dependências:
#   sysstat  — iostat  (CentOS: yum install sysstat / Debian: apt install sysstat)
#   dnsutils — dig     (CentOS: yum install bind-utils / Debian: apt install dnsutils)
##############################################################################


# ===========================================================
# CPU
# ===========================================================
# Retorna % uso CPU (user + system). Chave: cpu.utilization
# Trigger: avg(#10) >= 90 → "Consumo de CPU" HIGH
UserParameter=cpu.utilization,top -b -n1 | grep "Cpu(s)" | awk '{print $2 + $4}'


# ===========================================================
# DISCO RAIZ
# ===========================================================
# Retorna % uso do / (raiz). Chave: disk.used.percent.root
# Trigger: avg(#3) >= 90 → "Consumo de disco elevado" HIGH
#          avg(#3) >= 99 → "Disco Cheio" HIGH
#
# ATENÇÃO: chave antiga era disk.usage — não bate com o template.
#          Usar obrigatoriamente disk.used.percent.root.
UserParameter=disk.used.percent.root,df / | awk 'NR==2 {gsub(/%/,"",$5); print $5}'


# ===========================================================
# DISCO I/O  (requer: sysstat)
# ===========================================================
# Auto-detecta o primeiro dispositivo de disco (sd*, vd*, nvme*, xvd*).
# Sem hardcode de sda — funciona em VMs KVM (vda), AWS (xvda), NVMe.
#
# Taxa de leitura IOPS. Chave: disk.iostat.read
UserParameter=disk.iostat.read,iostat -d -x 1 2 | awk '/^(sd|vd|nvme|xvd)/{print $4; exit}' | sed 's/[^0-9.]*//g'

# Taxa de escrita IOPS. Chave: disk.iostat.write
UserParameter=disk.iostat.write,iostat -d -x 1 2 | awk '/^(sd|vd|nvme|xvd)/{print $5; exit}' | sed 's/[^0-9.]*//g'

# Tempo médio de espera (ms). Chave: disk.iostat.await
UserParameter=disk.iostat.await,iostat -d -x 1 2 | awk '/^(sd|vd|nvme|xvd)/{print $10; exit}' | sed 's/,/./'

# Tempo médio de espera — leitura (ms). Chave: disk.iostat.r_await
UserParameter=disk.iostat.r_await,iostat -d -x 1 2 | awk '/^(sd|vd|nvme|xvd)/{print $11; exit}' | sed 's/,/./'

# Tempo médio de espera — escrita (ms). Chave: disk.iostat.w_await
UserParameter=disk.iostat.w_await,iostat -d -x 1 2 | awk '/^(sd|vd|nvme|xvd)/{print $12; exit}' | sed 's/,/./'


# ===========================================================
# REDE
# ===========================================================
# Auto-detecta a interface padrão via rota default (eth0, ens3, enp2s0...).
# Retorna bytes acumulados — o template aplica SIMPLE_CHANGE (delta) + x8 para bps.
#
# Chave: net.if.input.mbps
UserParameter=net.if.input.mbps,cat /sys/class/net/$(ip route | awk '/default/{print $5; exit}')/statistics/rx_bytes

# Chave: net.if.output.mbps
UserParameter=net.if.output.mbps,cat /sys/class/net/$(ip route | awk '/default/{print $5; exit}')/statistics/tx_bytes


# ===========================================================
# UPTIME
# ===========================================================
# Uptime em segundos. Chave: uptime.system
# Trigger: < 86400s → "Host Reiniciado" HIGH / recovery >= 3600s
UserParameter=uptime.system,awk '{print int($1)}' /proc/uptime


# ===========================================================
# SEGURANÇA — SSH
# ===========================================================
# Contagem acumulada de falhas de login SSH.
# CentOS/RHEL: lê /var/log/secure  |  Debian/Ubuntu: /var/log/auth.log
# Chave: ssh.failed.logins
# Trigger: change() > 100 → "Tentativa de brute force" AVERAGE
UserParameter=ssh.failed.logins,grep -sc "Failed password" /var/log/secure /var/log/auth.log 2>/dev/null | awk -F: '{sum+=$2} END{print sum+0}'


# ===========================================================
# DNS  (requer: dnsutils / bind-utils)
# ===========================================================
# Cada chave retorna 1=OK ou 0=FALHA.
# Trigger: todos = 0 ao mesmo tempo → "Falha de resolução DNS" HIGH
#          (só dispara se TODOS falharem — indica problema local de DNS)
#
# Chave: dns.check.globo
UserParameter=dns.check.globo,dig +short +time=3 +tries=1 globo.com 2>/dev/null | grep -cP "^\d" | awk '{print ($1>0)?1:0}'

# Chave: dns.check.registrobr
UserParameter=dns.check.registrobr,dig +short +time=3 +tries=1 registro.br 2>/dev/null | grep -cP "^\d" | awk '{print ($1>0)?1:0}'

# Chave: dns.check.uol
UserParameter=dns.check.uol,dig +short +time=3 +tries=1 uol.com.br 2>/dev/null | grep -cP "^\d" | awk '{print ($1>0)?1:0}'

# Chave: dns.check.youtube
UserParameter=dns.check.youtube,dig +short +time=3 +tries=1 youtube.com 2>/dev/null | grep -cP "^\d" | awk '{print ($1>0)?1:0}'


