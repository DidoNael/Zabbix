# ============================================================================
# nginx-zabbix.conf — Referência do server block do frontend Zabbix
# ----------------------------------------------------------------------------
# O pacote zabbix-nginx-conf instala este bloco em /etc/zabbix/nginx.conf.
# O install.sh ajusta 'listen' e 'server_name' automaticamente a partir do .env.
# Use este arquivo como REFERÊNCIA (inclui exemplo de HTTPS/TLS comentado).
# ============================================================================

server {
    listen          80;
    server_name     zabbix.exemplo.com.br;

    root    /usr/share/zabbix;
    index   index.php;

    # Após configurar TLS (ver seguranca/README.md), force HTTPS:
    # return 301 https://$host$request_uri;

    location = /favicon.ico { log_not_found off; }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets {
        access_log off;
        expires 10d;
    }

    location ~ /\.ht      { deny all; }
    location ~ /(api\/|conf[^\.]|include|locale) { deny all; return 404; }
    location /vendor      { deny all; return 404; }

    location ~ [^/]\.php(/|$) {
        fastcgi_pass    unix:/run/php/zabbix.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index   index.php;
        fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include         fastcgi_params;
        fastcgi_param   QUERY_STRING     $query_string;
        fastcgi_param   REQUEST_METHOD   $request_method;
        fastcgi_param   CONTENT_TYPE     $content_type;
        fastcgi_param   CONTENT_LENGTH   $content_length;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }
}

