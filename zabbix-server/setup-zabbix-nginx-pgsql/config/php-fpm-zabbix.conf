; ============================================================================
; php-fpm-zabbix.conf — Referência do pool PHP-FPM do frontend Zabbix
; ----------------------------------------------------------------------------
; O pacote zabbix-nginx-conf instala este pool em /etc/zabbix/php-fpm.conf.
; O install.sh ajusta apenas date.timezone. Os valores abaixo são os MÍNIMOS
; exigidos pelo frontend do Zabbix 7.0 — não reduza.
; ============================================================================
[zabbix]
user = www-data
group = www-data
listen = /run/php/zabbix.sock
listen.acl_users = www-data,nginx
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35

php_value[session.save_handler] = files
php_value[session.save_path]    = /var/lib/php/sessions/

; --- Requisitos mínimos do frontend Zabbix 7.0 ---
php_value[max_execution_time]  = 300
php_value[memory_limit]        = 128M
php_value[post_max_size]       = 16M
php_value[upload_max_filesize] = 2M
php_value[max_input_time]      = 300
php_value[max_input_vars]      = 10000
; AJUSTE para o seu fuso (o install.sh sobrescreve com ZABBIX_TIMEZONE do .env):
php_value[date.timezone] = America/Sao_Paulo
