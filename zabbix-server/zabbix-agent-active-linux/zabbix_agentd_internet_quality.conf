# UserParameters para Template Internet Quality Linux LLD - Netstream
# Instalar em: /etc/zabbix/zabbix_agentd.d/internet_quality.conf
# Scripts em:  /usr/lib/zabbix/scripts/
# Permissao:   chmod +x /usr/lib/zabbix/scripts/*.sh

# ===========================================================
# PING
# ===========================================================
UserParameter=discover.ping[*],/usr/lib/zabbix/scripts/discover_ping.sh "$1"
UserParameter=internet.ping.latency[*],/usr/lib/zabbix/scripts/ping_check.sh "$1" latency
UserParameter=internet.ping.loss[*],/usr/lib/zabbix/scripts/ping_check.sh "$1" loss
UserParameter=internet.ping.jitter[*],/usr/lib/zabbix/scripts/ping_check.sh "$1" jitter

# ===========================================================
# HTTP / SSL
# ===========================================================
UserParameter=discover.http[*],/usr/lib/zabbix/scripts/discover_http.sh "$1"
UserParameter=site.http.time[*],/usr/lib/zabbix/scripts/site_http.sh "$1" time
UserParameter=site.http.status[*],/usr/lib/zabbix/scripts/site_http.sh "$1" status
UserParameter=site.http.ssl_days[*],/usr/lib/zabbix/scripts/site_http.sh "$1" ssl_days

# ===========================================================
# TRACEROUTE
# ===========================================================
UserParameter=discover.traceroute[*],/usr/lib/zabbix/scripts/discover_traceroute.sh "$1"
UserParameter=site.traceroute.hops[*],/usr/lib/zabbix/scripts/traceroute_check.sh "$1" hops
UserParameter=site.traceroute.last_rtt[*],/usr/lib/zabbix/scripts/traceroute_check.sh "$1" last_rtt
UserParameter=site.traceroute.max_rtt[*],/usr/lib/zabbix/scripts/traceroute_check.sh "$1" max_rtt

# ===========================================================
# MTR
# ===========================================================
UserParameter=discover.mtr[*],/usr/lib/zabbix/scripts/discover_mtr.sh "$1"
UserParameter=site.mtr.avg_rtt[*],/usr/lib/zabbix/scripts/mtr_check.sh "$1" avg_rtt
UserParameter=site.mtr.loss[*],/usr/lib/zabbix/scripts/mtr_check.sh "$1" loss

# ===========================================================
# DNS
# ===========================================================
UserParameter=discover.dns[*],/usr/lib/zabbix/scripts/discover_dns.sh "$1" "$2"
UserParameter=site.dns.resolve_time[*],/usr/lib/zabbix/scripts/dns_check.sh "$1" "$2" resolve_time
UserParameter=site.dns.status[*],/usr/lib/zabbix/scripts/dns_check.sh "$1" "$2" status

# ===========================================================
# SPEEDTEST
# ===========================================================
UserParameter=internet.speed.download,/usr/lib/zabbix/scripts/speedtest_check.sh download
UserParameter=internet.speed.upload,/usr/lib/zabbix/scripts/speedtest_check.sh upload
