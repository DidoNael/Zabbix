# UserParameters para Template Internet Quality Windows LLD - Netstream
# Instalar em: C:\Program Files\Zabbix Agent\zabbix_agentd.d\internet_quality.conf
#   OU adicionar diretamente em: C:\Program Files\Zabbix Agent\zabbix_agentd.conf
# Scripts em: C:\zabbix\scripts\
#
# Apos instalar, reiniciar o servico:
#   Restart-Service "Zabbix Agent"

# ===========================================================
# PING (latencia, perda de pacotes, jitter)
# ===========================================================
UserParameter=discover.ping[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\discover_ping.ps1" "$1"
UserParameter=internet.ping.latency[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\ping_check.ps1" "$1" latency
UserParameter=internet.ping.loss[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\ping_check.ps1" "$1" loss
UserParameter=internet.ping.jitter[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\ping_check.ps1" "$1" jitter

# ===========================================================
# HTTP / SSL (tempo, status, dias ate expirar certificado)
# ===========================================================
UserParameter=discover.http[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\discover_http.ps1" "$1"
UserParameter=site.http.time[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\site_http.ps1" "$1" time
UserParameter=site.http.status[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\site_http.ps1" "$1" status
UserParameter=site.http.ssl_days[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\site_http.ps1" "$1" ssl_days

# ===========================================================
# TRACERT (hops, RTT ultimo hop, RTT maximo)
# ===========================================================
UserParameter=discover.tracert[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\discover_tracert.ps1" "$1"
UserParameter=site.tracert.hops[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\tracert_check.ps1" "$1" hops
UserParameter=site.tracert.last_rtt[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\tracert_check.ps1" "$1" last_rtt
UserParameter=site.tracert.max_rtt[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\tracert_check.ps1" "$1" max_rtt

# ===========================================================
# MTR (RTT medio e perda ao destino final)
# ===========================================================
UserParameter=discover.mtr[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\discover_mtr.ps1" "$1"
UserParameter=site.mtr.avg_rtt[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\mtr_check.ps1" "$1" avg_rtt
UserParameter=site.mtr.loss[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\mtr_check.ps1" "$1" loss

# ===========================================================
# DNS (tempo de resolucao e status via dig/nslookup)
# ===========================================================
UserParameter=discover.dns[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\discover_dns.ps1" "$1" "$2"
UserParameter=site.dns.resolve_time[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\dns_check.ps1" "$1" "$2" resolve_time
UserParameter=site.dns.status[*],powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\dns_check.ps1" "$1" "$2" status

# ===========================================================
# SPEEDTEST (download e upload via Ookla CLI)
# ===========================================================
UserParameter=internet.speed.download,powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\speedtest.ps1" download
UserParameter=internet.speed.upload,powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\zabbix\scripts\speedtest.ps1" upload
